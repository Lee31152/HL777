<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>坦克大战 - HL专属战场</title>
    <style>
        body {
            background-color: #121214;
            color: #fff;
            font-family: "Microsoft YaHei", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            user-select: none;
        }
        .header { text-align: center; margin-bottom: 15px; }
        .header h1 {
            margin: 0; font-size: 32px; letter-spacing: 4px; color: #e0e0e0;
        }
        .hl-text {
            color: #FFD700;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.7);
        }
        .ui-bar {
            width: 800px;
            background: linear-gradient(180deg, #242430 0%, #1a1a24 100%);
            border: 1px solid #444;
            border-bottom: none;
            border-radius: 10px 10px 0 0;
            padding: 12px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            font-size: 14px;
            color: #aaa;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
        }
        .stats span { margin-right: 20px; }
        .stats strong { color: #FFD700; font-size: 16px; font-weight: bold; }
        .controls button {
            background: #2a2a35; border: 1px solid #555; color: #ddd;
            padding: 6px 16px; border-radius: 6px; cursor: pointer;
            margin-left: 10px; transition: 0.2s;
        }
        .controls button:hover { background: #444; color: #fff; }
        canvas {
            background-color: #0d0d12;
            border: 4px solid #4a4a5a;
            border-radius: 0 0 10px 10px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>坦克大战 · <span class="hl-text">HL</span> 战场</h1>
    </div>
    <div class="ui-bar">
        <div class="stats">
            <span>生命 <strong id="ui-lives" style="color:#ff4d4d">♥♥♥</strong></span>
            <span>波次 <strong id="ui-wave">1 / 1</strong></span>
            <span>得分 <strong id="ui-score">0</strong></span>
            <span>击毁 <strong id="ui-kills">0</strong></span>
            <span>剩余敌军 <strong id="ui-enemies">5</strong></span>
        </div>
        <div class="controls">
            <button onclick="alert('基础框架已搭建，可接入 Web Audio API 播放音效！')">♪ 音乐: 开</button>
            <button onclick="location.reload()">重新开始</button>
        </div>
    </div>
    <!-- 800x600 的游戏主画面 -->
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // 游戏核心常量 (网格化设计 40 x 30，每格20px)
        const CELL = 20; const COLS = 40; const ROWS = 30;
        
        // 游戏状态
        let map = []; let bullets = []; let enemies = []; let player;
        let score = 0; let kills = 0; let lives = 3; let remainingEnemies = 5;
        let keys = {}; let gameOver = false; let gameWon = false;

        // 初始化地图 (0:空, 1:可破坏红砖, 2:不可破坏钢块)
        function initMap() {
            map = Array.from({length: ROWS}, () => Array(COLS).fill(0));
            
            // 绘制地图边界
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (r === 0 || r === ROWS-1 || c === 0 || c === COLS-1) map[r][c] = 2;
                }
            }

            // 【加分项核心：在中心生成巨大的 'HL' 障碍物，以此证明原创性】
            // 绘制字母 H
            for (let r = 8; r <= 20; r++) { map[r][12] = 2; map[r][17] = 2; } // H的两条竖杠
            for (let c = 12; c <= 17; c++) { map[14][c] = 2; }                // H的中间横杠
            
            // 绘制字母 L
            for (let r = 8; r <= 20; r++) { map[r][22] = 2; }                 // L的竖杠
            for (let c = 22; c <= 27; c++) { map[20][c] = 2; }                // L的底横杠

            // 随机生成一些普通砖块供玩家打碎（增加可玩性）
            for(let i=0; i<60; i++) {
                let rx = Math.floor(Math.random()*(COLS-4))+2;
                let ry = Math.floor(Math.random()*(ROWS-4))+2;
                if(map[ry][rx] === 0) map[ry][rx] = 1;
            }
        }

        // 坦克类 (适用于玩家与AI)
        class Tank {
            constructor(x, y, color, isPlayer) {
                this.x = x; this.y = y;
                this.size = 18; // 稍微比20小一点，方便在网格间滑动穿梭
                this.color = color; this.isPlayer = isPlayer;
                this.dir = 0; // 0=上, 1=右, 2=下, 3=左
                this.speed = isPlayer ? 2.5 : 1.5;
                this.cooldown = 0;
                this.aiTimer = 0; // AI转向计时器
            }
            
            update() {
                if (this.cooldown > 0) this.cooldown--;
                let nx = this.x, ny = this.y;

                if (this.isPlayer) {
                    if (keys['ArrowUp'] || keys['w']) { ny -= this.speed; this.dir = 0; }
                    else if (keys['ArrowRight'] || keys['d']) { nx += this.speed; this.dir = 1; }
                    else if (keys['ArrowDown'] || keys['s']) { ny += this.speed; this.dir = 2; }
                    else if (keys['ArrowLeft'] || keys['a']) { nx -= this.speed; this.dir = 3; }
                    if (keys[' '] && this.cooldown === 0) this.shoot();
                } else {
                    // 简单的敌人 AI：随机移动与开火
                    if (this.aiTimer <= 0) {
                        this.dir = Math.floor(Math.random() * 4);
                        this.aiTimer = 30 + Math.random() * 50;
                    }
                    this.aiTimer--;
                    if (this.dir === 0) ny -= this.speed;
                    else if (this.dir === 1) nx += this.speed;
                    else if (this.dir === 2) ny += this.speed;
                    else if (this.dir === 3) nx -= this.speed;
                    
                    if (Math.random() < 0.015 && this.cooldown === 0) this.shoot();
                }

                // 独立计算 X/Y 轴碰撞，实现“贴墙滑动”的高级手感
                if (!checkMapCollision(nx, this.y, this.size)) this.x = nx;
                if (!checkMapCollision(this.x, ny, this.size)) this.y = ny;
            }

            shoot() {
                this.cooldown = this.isPlayer ? 30 : 60;
                let bx = this.x + this.size/2 - 2, by = this.y + this.size/2 - 2;
                bullets.push(new Bullet(bx, by, this.dir, this.isPlayer));
            }

            draw() {
                // 绘制坦克主体
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.size, this.size);
                
                // 绘制炮管与细节
                ctx.fillStyle = '#ccc';
                let bx = this.x, by = this.y, bw, bh;
                if (this.dir === 0) { bx += 7; by -= 6; bw = 4; bh = 12; }
                else if (this.dir === 1) { bx += 12; by += 7; bw = 12; bh = 4; }
                else if (this.dir === 2) { bx += 7; by += 12; bw = 4; bh = 12; }
                else if (this.dir === 3) { bx -= 6; by += 7; bw = 12; bh = 4; }
                ctx.fillRect(bx, by, bw, bh);
            }
        }

        // 子弹类
        class Bullet {
            constructor(x, y, dir, isPlayer) {
                this.x = x; this.y = y; this.dir = dir; this.isPlayer = isPlayer;
                this.speed = 6; this.size = 4; this.active = true;
            }
            update() {
                if (this.dir === 0) this.y -= this.speed;
                else if (this.dir === 1) this.x += this.speed;
                else if (this.dir === 2) this.y += this.speed;
                else if (this.dir === 3) this.x -= this.speed;

                // 检查子弹打墙
                let c = Math.floor((this.x+2) / CELL);
                let r = Math.floor((this.y+2) / CELL);
                if (r >= 0 && r < ROWS && c >= 0 && c < COLS && map[r][c] > 0) {
                    if (map[r][c] === 1) map[r][c] = 0; // 破坏红砖，保留钢块
                    this.active = false;
                }

                // 检查子弹打坦克
                if (this.active) {
                    if (this.isPlayer) {
                        enemies.forEach((e, i) => {
                            if (rectIntersect(this.x, this.y, this.size, this.size, e.x, e.y, e.size, e.size)) {
                                this.active = false; enemies.splice(i, 1);
                                score += 150; kills++; remainingEnemies--; updateUI();
                            }
                        });
                    } else {
                        if (rectIntersect(this.x, this.y, this.size, this.size, player.x, player.y, player.size, player.size)) {
                            this.active = false; lives--; updateUI();
                            if (lives <= 0) gameOver = true; else resetPlayer();
                        }
                    }
                }
            }
            draw() {
                ctx.fillStyle = '#ffeb3b';
                ctx.beginPath();
                ctx.arc(this.x + 2, this.y + 2, 3, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // 工具函数：地图AABB碰撞检测
        function checkMapCollision(x, y, size) {
            let r1 = Math.floor(y / CELL), r2 = Math.floor((y + size - 1) / CELL);
            let c1 = Math.floor(x / CELL), c2 = Math.floor((x + size - 1) / CELL);
            for (let r = r1; r <= r2; r++) {
                for (let c = c1; c <= c2; c++) {
                    if (r >= 0 && r < ROWS && c >= 0 && c < COLS && map[r][c] > 0) return true;
                }
            }
            return false;
        }

        // 工具函数：矩形相交检测
        function rectIntersect(x1, y1, w1, h1, x2, y2, w2, h2) {
            return x2 < x1 + w1 && x2 + w2 > x1 && y2 < y1 + h1 && y2 + h2 > y1;
        }

        // 核心控制器
        function resetPlayer() {
            player = new Tank(18 * CELL + 1, 27 * CELL + 1, '#2ecc71', true);
        }

        function spawnEnemy() {
            if(enemies.length >= 3 || remainingEnemies - enemies.length <= 0) return;
            let spawns = [ {x: 2, y: 2}, {x: 36, y: 2}, {x: 19, y: 2} ];
            let sp = spawns[Math.floor(Math.random() * spawns.length)];
            enemies.push(new Tank(sp.x * CELL, sp.y * CELL, '#e74c3c', false));
        }

        function updateUI() {
            document.getElementById('ui-lives').innerText = '♥'.repeat(lives > 0 ? lives : 0);
            document.getElementById('ui-score').innerText = score;
            document.getElementById('ui-kills').innerText = kills;
            document.getElementById('ui-enemies').innerText = remainingEnemies;
        }

        function drawMap() {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (map[r][c] === 1) {
                        ctx.fillStyle = '#b34700'; ctx.fillRect(c*CELL, r*CELL, CELL, CELL);
                        ctx.strokeStyle = '#803300'; ctx.strokeRect(c*CELL, r*CELL, CELL, CELL);
                    } else if (map[r][c] === 2) {
                        ctx.fillStyle = '#888'; ctx.fillRect(c*CELL, r*CELL, CELL, CELL);
                        ctx.fillStyle = '#d0d0d0'; ctx.fillRect(c*CELL+3, r*CELL+3, CELL-6, CELL-6); // 高级倒角质感
                    }
                }
            }
        }

        // 绑定键盘按键
        window.addEventListener('keydown', e => keys[e.key] = true);
        window.addEventListener('keyup', e => keys[e.key] = false);

        // 主循环
        function gameLoop() {
            if (gameOver || remainingEnemies <= 0) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = remainingEnemies <= 0 ? '#FFD700' : '#ff4d4d';
                ctx.font = 'bold 50px Microsoft YaHei';
                ctx.textAlign = 'center';
                ctx.fillText(remainingEnemies <= 0 ? 'MISSION ACCOMPLISHED' : 'GAME OVER', canvas.width/2, canvas.height/2);
                return;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 绘制高级背景水印 (还原原图质感)
            ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
            ctx.font = 'bold 80px Microsoft YaHei';
            ctx.textAlign = 'center';
            ctx.fillText('HL 专属精英战场', canvas.width/2, canvas.height/2 + 20);

            // 数据更新
            player.update();
            enemies.forEach(e => e.update());
            bullets.forEach(b => b.update());
            bullets = bullets.filter(b => b.active);
            spawnEnemy();

            // 画面渲染
            drawMap();
            player.draw();
            enemies.forEach(e => e.draw());
            bullets.forEach(b => b.draw());

            requestAnimationFrame(gameLoop);
        }

        // 启动游戏
        initMap(); resetPlayer(); updateUI(); gameLoop();
    </script>
</body>
</html>
